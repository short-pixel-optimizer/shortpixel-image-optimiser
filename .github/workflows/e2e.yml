# Browser end-to-end tests (Playwright) against a real served WordPress —
# the same Docker stack bin/test-e2e.sh runs locally (docker-compose.e2e.yml),
# so a green run here means a green run on any developer machine.
#
# One job per browser engine, in parallel on separate runners (a serial
# three-engine run would take ~35 min). The screenshot regression project
# (`visual`, Chromium-only baselines) rides along in the Chromium job.
name: E2E (browser)

on:
  push:
    branches: [e2e-tests, updates]
  pull_request:
    branches: [updates, master]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright / ${{ matrix.engine }} / WP latest
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Every engine reports its own verdict; one red engine must not hide
      # whether the others are green.
      fail-fast: false
      matrix:
        include:
          - engine: chromium
            projects: --project chromium --project visual
          - engine: firefox
            projects: --project firefox
          - engine: webkit
            projects: --project webkit

    steps:
      - uses: actions/checkout@v5

      # Optional: authenticated Docker Hub pulls get a much higher rate
      # limit than the anonymous pool GitHub runners share. Add the two
      # repository secrets and uncomment if pulls ever start failing with
      # 429 / "toomanyrequests" rather than transient resets.
      # - uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Separate step so a registry hiccup is attributable at a glance.
      # Pulls retry with exponential backoff (bin/lib/retry.sh) — the first
      # ever run died on a "connection reset by peer" from Docker Hub's
      # token endpoint while pulling wordpress:cli-php8.3.
      - name: Pull images (with retry)
        env:
          CI: "1"
        run: bin/test-e2e.sh --pull-only

      - name: Run the E2E suite (${{ matrix.engine }})
        env:
          CI: "1"
        run: bin/test-e2e.sh ${{ matrix.projects }}

      - name: WordPress container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color wordpress | tail -n 200

      # On a visual failure the report holds expected / actual / diff PNGs.
      - name: Upload Playwright artifacts (traces, screenshots, diffs, report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.engine }}
          path: |
            tests/E2E/artifacts/html-report
            tests/E2E/artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
