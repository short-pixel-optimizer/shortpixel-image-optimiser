name: SPIO PHPUnit Tests

on:
  push:
    branches: [ unit-tests ]
  pull_request:
    branches: [ updates ]

jobs:
  build:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    env:
      WP_CORE_DIR: /tmp/wordpress
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_VERSION: latest
      DB_NAME: wordpress_test
      DB_USER: root
      DB_PASS: password
      DB_HOST: 127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'  # change this to the PHP version you need
          extensions: mbstring, mysqli, json, xml
          ini-values: post_max_size=256M, memory_limit=512M
          tools: composer

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WP-CLI
        run: |
          curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Install Composer dependencies
        run: |
          composer clear-cache
          composer update --no-interaction --prefer-dist

      - name: Install WordPress Unit Test Suite
        run: |
          mkdir -p "${WP_TESTS_DIR}"
          bash bin/install-wp-tests.sh "$DB_NAME" "$DB_USER" "$DB_PASS" "$DB_HOST" "${WP_VERSION}"

      - name: Show PHPUnit + config sanity check
        run: |
          echo "=== PHPUnit binary + version ==="
          which vendor/bin/phpunit
          vendor/bin/phpunit --version
          echo ""
          echo "=== Test files discovered on disk ==="
          find tests -type f -name 'test-*.php' | sort
          echo ""
          echo "=== Total: $(find tests -type f -name 'test-*.php' | wc -l) test files ==="
          echo ""
          echo "=== Test suites PHPUnit will recognise ==="
          vendor/bin/phpunit --list-suites
          echo ""
          echo "=== Test methods PHPUnit will run (across all suites) ==="
          vendor/bin/phpunit --list-tests | tee /tmp/phpunit-tests.txt
          echo ""
          echo "=== Test method count: $(grep -c ' - ' /tmp/phpunit-tests.txt || echo 0) ==="

      - name: Run each PHPUnit testsuite explicitly
        run: |
          # Run each testsuite in its own phpunit invocation so we get a
          # per-suite exit code + summary. We deliberately DON'T `set -e`
          # here — we want every suite to run even if an earlier one
          # fails, so a single broken suite doesn't hide the state of
          # the rest. Aggregated exit code is checked at the end.
          FAILED=0
          FAILED_SUITES=""

          for SUITE in "Helper" "model" "External" "SPIO Main"; do
            echo ""
            echo "=============================================================="
            echo "=== Running testsuite: $SUITE"
            echo "=============================================================="
            vendor/bin/phpunit --testsuite "$SUITE" --testdox --colors=never
            RC=$?
            echo ""
            echo "=== Testsuite '$SUITE' exit code: $RC"
            if [ $RC -ne 0 ]; then
              FAILED=1
              FAILED_SUITES="$FAILED_SUITES '$SUITE'"
            fi
          done

          echo ""
          echo "=============================================================="
          if [ $FAILED -ne 0 ]; then
            echo "!!! FAILED testsuites:$FAILED_SUITES"
            echo "=============================================================="
            exit 1
          fi
          echo "=== All testsuites passed"
          echo "=============================================================="
